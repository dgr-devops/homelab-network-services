# homelab.conf — resolutor recursivo Unbound, solo accesible desde la propia pasarela.
#
# dnsmasq (puerto 53) atiende a la LAN y reenvía a este Unbound (127.0.0.1#5335).
# Validar:  unbound-checkconf config/unbound/homelab.conf

server:
    interface: 127.0.0.1
    port: 5335
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    access-control: 127.0.0.0/8 allow
    access-control: 0.0.0.0/0 refuse

    # Endurecimiento básico.
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-referral-path: yes
    qname-minimisation: yes
    use-caps-for-id: no
    unwanted-reply-threshold: 10000000

    # Los nombres privados no se envían a Internet.
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-domain: "home.arpa"

    # Caché.
    cache-min-ttl: 300
    cache-max-ttl: 86400
    prefetch: yes
    num-threads: 1

    verbosity: 1
    logfile: ""
    use-syslog: yes
