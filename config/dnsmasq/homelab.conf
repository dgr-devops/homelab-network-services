# homelab.conf — DNS y DHCP de la LAN con dnsmasq.
#
# Valores de EJEMPLO: red 192.168.50.0/24, dominio home.arpa (RFC 8375, reservado
# para redes domésticas: nunca chocará con un dominio real de Internet).
# Validar sin arrancar:  dnsmasq --test -C config/dnsmasq/homelab.conf

# --- General --------------------------------------------------------------
# No leer /etc/resolv.conf: los reenviadores se fijan abajo, así el resultado es reproducible.
no-resolv
# No escuchar en interfaces que no se nombren (evita abrir el DNS hacia Internet).
bind-interfaces
interface=eth1
listen-address=192.168.50.1
listen-address=127.0.0.1
# El puerto 53 es de dnsmasq; Unbound escucha en 5335 solo en loopback.
port=53

# --- DNS ------------------------------------------------------------------
# Reenvío a Unbound local (resolutor recursivo con DNSSEC).
server=127.0.0.1#5335
domain=home.arpa
local=/home.arpa/
expand-hosts
domain-needed
bogus-priv
# Cacheo moderado; los registros locales de abajo no caducan.
cache-size=1000
# Nombres fijos del homelab.
address=/gateway.home.arpa/192.168.50.1
host-record=nas.home.arpa,192.168.50.10
host-record=pi.home.arpa,192.168.50.11
cname=files.home.arpa,nas.home.arpa

# --- DHCP -----------------------------------------------------------------
# Rango dinámico .100-.199, 12 h de concesión. Las IP fijas quedan fuera del rango.
dhcp-range=192.168.50.100,192.168.50.199,255.255.255.0,12h
dhcp-option=option:router,192.168.50.1
dhcp-option=option:dns-server,192.168.50.1
dhcp-option=option:domain-search,home.arpa
dhcp-authoritative
# Reservas por MAC (MAC de EJEMPLO, rango de documentación 00:00:5e:00:53:xx de RFC 7042).
dhcp-host=00:00:5e:00:53:10,nas,192.168.50.10
dhcp-host=00:00:5e:00:53:11,pi,192.168.50.11
# Fichero de concesiones fuera de /tmp para que sobreviva a reinicios.
dhcp-leasefile=/var/lib/misc/dnsmasq.leases

# --- Registro -------------------------------------------------------------
log-dhcp
log-facility=/var/log/dnsmasq.log
